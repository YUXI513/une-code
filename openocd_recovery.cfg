# PWLINK2 recovery connection for STM32G474.
# REQUIRES probe NRST/RST physically connected to the MCU NRST net.
# Keep the Buck power stage disconnected. Do not use with NRST unconnected.
# Select this file only for recovery; the existing openocd.cfg is unchanged.
source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32g4x.cfg]

# Override the target script's 2000 kHz startup AND reset-start defaults.
adapter speed 100
$_TARGETNAME configure -event reset-start { adapter speed 100 }
reset_config srst_only srst_nogate connect_assert_srst
